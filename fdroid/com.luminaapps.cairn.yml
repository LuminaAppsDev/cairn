# F-Droid build recipe for the OFFICIAL F-Droid repository.
#
# This file is NOT used by the app or by CI. It is the source of truth for the
# entry you submit to https://gitlab.com/fdroid/fdroiddata as
# `metadata/com.luminaapps.cairn.yml` (after opening an RFP issue — see
# docs/RELEASE.md §2a). F-Droid builds the app from source on its own
# infrastructure and signs it with the F-Droid key.
#
# Listing text + screenshots are imported automatically from
# `fastlane/metadata/android/` in the app repo — they are not duplicated here.

Categories:
  - Sports & Health
License: MIT
AuthorName: Max Fiedler
# F-Droid needs a publicly clonable git repo with the release tags. The public,
# user-facing repository is GitHub.
SourceCode: https://github.com/LuminaAppsDev/cairn
IssueTracker: https://github.com/LuminaAppsDev/cairn/issues

# The launcher label, auto-derived by F-Droid from the built APK. Committed so
# `fdroid checkupdates --auto` (which F-Droid CI runs, then fails on any diff)
# is a no-op. The listing's display title still comes from fastlane title.txt
# ("Cairn: Health Aggregator").
AutoName: Cairn

RepoType: git
Repo: https://github.com/LuminaAppsDev/cairn.git

# Reproducible builds: F-Droid rebuilds each block and compares the result
# byte-for-byte against the matching upstream APK below, then publishes ours
# rather than an F-Droid-signed one. One app-level template covers all three
# per-ABI blocks because the release assets are named by versionCode and %c
# resolves to each block's own code (%v is the versionName). There is no ABI
# placeholder, which is why the filenames encode the code rather than the ABI.
# Verified before submission: the published cairn-v0.2.2-72.apk is byte-identical
# to a rebuild of this commit inside F-Droid's own buildserver image.
Binaries: https://github.com/LuminaAppsDev/cairn/releases/download/v%v/cairn-v%v-%c.apk

Builds:
  # ABI split: one build block per ABI. F-Droid resolves each block's `output`
  # to exactly one APK, so a single block with a glob that matches all three
  # splits fails ("Multiple apks match"). Instead, each block builds just its
  # ABI via `--target-platform` (which still yields a split APK, so the
  # versionCodeOverride in android/app/build.gradle.kts applies) and names that
  # ABI's file. Version codes are base*10 + {1,2,3} — armeabi-v7a=71,
  # arm64-v8a=72, x86_64=73 for build 7 — matching the gradle `abiCodes` and the
  # VercodeOperation below, ascending as F-Droid requires.
  #
  # REPRODUCIBLE BUILDS — why each block moves the checkout to /build/cairn.
  # Dart's AOT compiler bakes the absolute Flutter project root into libapp.so
  # (flutter/flutter#165111), so a release APK contains the literal string
  # "file://<project root>/.dart_tool/flutter_build/dart_plugin_registrant.dart".
  # Upstream CI compiles at /build/cairn (BUILD_DIR in
  # .forgejo/workflows/release.yml) and these blocks move the checkout onto the
  # same path, so the two builds agree byte-for-byte. The move happens in BOTH
  # prebuild and build because `pub get` also writes absolute paths into
  # .dart_tool/, and each is a separate shell whose cwd F-Droid sets to the app
  # dir — hence the mv/pushd ... popd/mv-back round trip in each. PUB_CACHE is
  # pinned inside the moved tree so package paths match upstream too.
  #
  # Seed = the v0.2.2 commit: the first tag that both publishes per-ABI APKs and
  # carries the reproducibility fixes (pinned build path, build-id suppression),
  # so it is the earliest tag whose output can be verified against `Binaries`
  # below. Earlier tags published only a universal APK. F-Droid requires an
  # immutable full commit hash. srclibs/rm/sudo/prebuild/scandelete are identical
  # across the three blocks (F-Droid's `rewritemeta` expands YAML anchors back
  # out, so they are repeated verbatim).
  - versionName: 0.2.2
    versionCode: 71
    commit: 3c1951b2906a8a65697e3edb4def5060bd32cbae
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    sudo:
      - mkdir -p /build
      - chown -R vagrant /build
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml | head -1)
      - '[ -n "$flutterVersion" ]'
      - flutterCommit=$(sed -n -E "s/.*FLUTTER_COMMIT:\s*'?([0-9a-f]{40})'?.*/\1/p" .forgejo/workflows/release.yml | head -1)
      - '[ -n "$flutterCommit" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      # Tags are mutable. Upstream CI records the commit the tag resolved to and
      # fails closed on a mismatch; do the same here, so a repointed tag surfaces
      # as an obvious toolchain error rather than an unexplained reproducibility
      # failure. Both values live in the same file, so they cannot drift.
      - '[ "$(git -C $$flutter$$ rev-parse HEAD)" = "$flutterCommit" ]'
      - export FLUTTER_BIN=$(cd $$flutter$$ && pwd)/bin/flutter
      - cd ..
      # Idempotent: if an earlier attempt in this buildserver session failed
      # between the two moves, the checkout is stranded at /build/cairn. Moving
      # again would nest it (mv src existing-dir) and silently build the wrong
      # tree, masking the original error.
      - '[ -d com.luminaapps.cairn ] && rm -rf /build/cairn && mv com.luminaapps.cairn /build/cairn || [ -d /build/cairn ]'
      - pushd /build/cairn >/dev/null
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $FLUTTER_BIN config --no-analytics
      - $FLUTTER_BIN pub get --enforce-lockfile
      - popd >/dev/null
      - mv /build/cairn com.luminaapps.cairn
    scandelete:
      - .pub-cache
    build:
      - export FLUTTER_BIN=$(cd $$flutter$$ && pwd)/bin/flutter
      - cd ..
      # Idempotent: if an earlier attempt in this buildserver session failed
      # between the two moves, the checkout is stranded at /build/cairn. Moving
      # again would nest it (mv src existing-dir) and silently build the wrong
      # tree, masking the original error.
      - '[ -d com.luminaapps.cairn ] && rm -rf /build/cairn && mv com.luminaapps.cairn /build/cairn || [ -d /build/cairn ]'
      - pushd /build/cairn >/dev/null
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $FLUTTER_BIN build apk --release --split-per-abi --target-platform=android-arm
      - popd >/dev/null
      - mv /build/cairn com.luminaapps.cairn
