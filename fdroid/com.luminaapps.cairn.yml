Categories:
  - Sports & Health
License: MIT
AuthorName: Max Fiedler
SourceCode: https://github.com/LuminaAppsDev/cairn
IssueTracker: https://github.com/LuminaAppsDev/cairn/issues

AutoName: Cairn

RepoType: git
Repo: https://github.com/LuminaAppsDev/cairn.git

Builds:
  - versionName: 0.2.3
    versionCode: 81
    commit: 460e6bff83c495680420e8dab8030512fd2eacbc
    sudo:
      - mkdir -p /build
      - chown -R vagrant /build
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    binary: 
      https://github.com/LuminaAppsDev/cairn/releases/download/v%v/cairn-v%v-armeabi-v7a.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml
        | head -1)
      - '[ -n "$flutterVersion" ]'
      - flutterCommit=$(sed -n -E "s/.*FLUTTER_COMMIT:\s*'?([0-9a-f]{40})'?.*/\1/p"
        .forgejo/workflows/release.yml | head -1)
      - '[ -n "$flutterCommit" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - '[ "$(git -C $$flutter$$ rev-parse HEAD)" = "$flutterCommit" ]'
      - export FLUTTER_BIN=$(cd $$flutter$$ && pwd)/bin/flutter
      - cd ..
      - '[ -d com.luminaapps.cairn ] && rm -rf /build/cairn && mv com.luminaapps.cairn
        /build/cairn || [ -d /build/cairn ]'
      - pushd /build/cairn >/dev/null
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $FLUTTER_BIN config --no-analytics
      - $FLUTTER_BIN pub get --enforce-lockfile
      - popd >/dev/null
      - mv /build/cairn com.luminaapps.cairn
    scandelete:
      - .pub-cache
    build:
      - export FLUTTER_BIN=$(cd $$flutter$$ && pwd)/bin/flutter
      - cd ..
      - '[ -d com.luminaapps.cairn ] && rm -rf /build/cairn && mv com.luminaapps.cairn
        /build/cairn || [ -d /build/cairn ]'
      - pushd /build/cairn >/dev/null
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $FLUTTER_BIN build apk --release --split-per-abi --target-platform=android-arm
      - popd >/dev/null
      - mv /build/cairn com.luminaapps.cairn

