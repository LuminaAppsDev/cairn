# The signing certificate F-Droid must find on every downloaded reference
# binary, as lower-case hex SHA-256 with no colons — the form fdroidserver
# compares against. An upper-case value passes `fdroid lint` and then fails the
# build, and `fdroid rewritemeta` would normalise it but strips every comment in
# this file, so do not run it here. Confirmed identical across v0.1.0, v0.2.1,
# v0.2.2 and v0.2.3. Obtained with `apksigner verify --print-certs` (the documented
# `keytool -printcert -jarfile` one-liner prints nothing on a v2-only APK).
AllowedAPKSigningKeys: b53624a0de7eef20330857f3cc0f261fce1e5eeb4c60ad42a9f9487a8daac9e0

# New tags are picked up automatically. The version lives in pubspec.yaml
# (Flutter), not the Android manifest/gradle, so UpdateCheckData tells the tag
# checker how to read the base versionCode (digits after '+') and versionName
# (before '+'). VercodeOperation declares the per-ABI code scheme (base*10 +
# 1/2/3), mirroring the gradle abiCodes, so checkupdates computes the right
# CurrentVersionCode (the highest, 83) and can track future tags. The three
# per-ABI Builds blocks above are what actually build.
AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.2.3
CurrentVersionCode: 83
