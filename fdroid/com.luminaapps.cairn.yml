# F-Droid build recipe for the OFFICIAL F-Droid repository.
#
# This file is NOT used by the app or by CI. It is the source of truth for the
# entry you submit to https://gitlab.com/fdroid/fdroiddata as
# `metadata/com.luminaapps.cairn.yml` (after opening an RFP issue — see
# docs/RELEASE.md §2a). F-Droid builds the app from source on its own
# infrastructure and signs it with the F-Droid key.
#
# Listing text + screenshots are imported automatically from
# `fastlane/metadata/android/` in the app repo — they are not duplicated here.

Categories:
  - Sports & Health
License: MIT
AuthorName: Max Fiedler
# F-Droid needs a publicly clonable git repo with the release tags. The public,
# user-facing repository is GitHub.
SourceCode: https://github.com/LuminaAppsDev/cairn
IssueTracker: https://github.com/LuminaAppsDev/cairn/issues

# The launcher label, auto-derived by F-Droid from the built APK. Committed so
# `fdroid checkupdates --auto` (which F-Droid CI runs, then fails on any diff)
# is a no-op. The listing's display title still comes from fastlane title.txt
# ("Cairn: Health Aggregator").
AutoName: Cairn

RepoType: git
Repo: https://github.com/LuminaAppsDev/cairn.git

Builds:
  # Seed build for the ABI-split scheme (one APK per ABI, requested by the
  # F-Droid maintainer). v0.2.1 is the seed: it is the first tag whose
  # android/app/build.gradle.kts sets the per-ABI versionCode override, so the
  # three split APKs get distinct, ascending version codes. Earlier tags built a
  # single fat APK (and v0.1.0–0.1.2 had their own blockers), so they can't seed
  # a split build — all three ABIs would collide on one version code. F-Droid
  # requires an immutable full commit hash; this is the v0.2.1 commit.
  #
  # `--split-per-abi` produces app-armeabi-v7a / -arm64-v8a / -x86_64-release.apk
  # with version codes base*10 + {1,2,3} (61/62/63 for build 6). VercodeOperation
  # (below) declares those three codes; each maps to the matching APK from the
  # output glob.
  - versionName: 0.2.1
    versionCode: 61
    commit: d1db3b2fea0d2d57588181db4410352a34122252
    output: build/app/outputs/flutter-apk/app-*-release.apk
    srclibs:
      - flutter@stable
    # Drop the iOS platform dir from the Android build. Only android + ios
    # exist (the app targets Android + iOS); F-Droid errors if an rm: glob
    # matches nothing, so list only dirs that are actually present.
    rm:
      - ios
    prebuild:
      # Pin Flutter to the exact version CI builds with — single source of truth
      # is the literal `FLUTTER_VERSION:` in .forgejo/workflows/release.yml.
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml | head -1)
      - '[ -n "$flutterVersion" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi

# New tags are picked up automatically. The version lives in pubspec.yaml
# (Flutter), not the Android manifest/gradle, so UpdateCheckData tells the tag
# checker how to read the base versionCode (digits after '+') and versionName
# (before '+'). VercodeOperation then derives the three per-ABI codes
# (base*10 + 1/2/3), mirroring the build.gradle.kts scheme, so F-Droid tracks
# and builds all three ABIs for every tag.
AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.2.1
CurrentVersionCode: 63
