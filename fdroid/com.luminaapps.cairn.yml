# F-Droid build recipe for the OFFICIAL F-Droid repository.
#
# This file is NOT used by the app or by CI. It is the source of truth for the
# entry you submit to https://gitlab.com/fdroid/fdroiddata as
# `metadata/com.luminaapps.cairn.yml` (after opening an RFP issue — see
# docs/RELEASE.md §2a). F-Droid builds the app from source on its own
# infrastructure and signs it with the F-Droid key.
#
# Listing text + screenshots are imported automatically from
# `fastlane/metadata/android/` in the app repo — they are not duplicated here.

Categories:
  - Sports & Health
License: MIT
AuthorName: Max Fiedler
# F-Droid needs a publicly clonable git repo with the release tags. The public,
# user-facing repository is GitHub.
SourceCode: https://github.com/LuminaAppsDev/cairn
IssueTracker: https://github.com/LuminaAppsDev/cairn/issues

# The launcher label, auto-derived by F-Droid from the built APK. Committed so
# `fdroid checkupdates --auto` (which F-Droid CI runs, then fails on any diff)
# is a no-op. The listing's display title still comes from fastlane title.txt
# ("Cairn: Health Aggregator").
AutoName: Cairn

RepoType: git
Repo: https://github.com/LuminaAppsDev/cairn.git

Builds:
  # ABI split: one build block per ABI. F-Droid resolves each block's `output`
  # to exactly one APK, so a single block with a glob that matches all three
  # splits fails ("Multiple apks match"). Instead, each block builds just its
  # ABI via `--target-platform` (which still yields a split APK, so the
  # versionCodeOverride in android/app/build.gradle.kts applies) and names that
  # ABI's file. Version codes are base*10 + {1,2,3} — armeabi-v7a=61,
  # arm64-v8a=62, x86_64=63 for build 6 — matching the gradle `abiCodes` and the
  # VercodeOperation below, ascending as F-Droid requires.
  #
  # Seed = the v0.2.1 commit: the first tag whose build.gradle.kts sets the
  # per-ABI override (earlier tags built a single fat APK and can't seed a split
  # build — all three ABIs would collide on one code). F-Droid requires an
  # immutable full commit hash; this is the v0.2.1 commit. srclibs/rm/prebuild/
  # scandelete are identical across the three blocks (F-Droid's `rewritemeta`
  # expands YAML anchors back out, so they are repeated verbatim).
  - versionName: 0.2.1
    versionCode: 61
    commit: d1db3b2fea0d2d57588181db4410352a34122252
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml | head -1)
      - '[ -n "$flutterVersion" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm
  - versionName: 0.2.1
    versionCode: 62
    commit: d1db3b2fea0d2d57588181db4410352a34122252
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml | head -1)
      - '[ -n "$flutterVersion" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm64
  - versionName: 0.2.1
    versionCode: 63
    commit: d1db3b2fea0d2d57588181db4410352a34122252
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\s*'?([0-9.]+)'?.*/\1/p" .forgejo/workflows/release.yml | head -1)
      - '[ -n "$flutterVersion" ]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-x64

# New tags are picked up automatically. The version lives in pubspec.yaml
# (Flutter), not the Android manifest/gradle, so UpdateCheckData tells the tag
# checker how to read the base versionCode (digits after '+') and versionName
# (before '+'). VercodeOperation declares the per-ABI code scheme (base*10 +
# 1/2/3), mirroring the gradle abiCodes, so checkupdates computes the right
# CurrentVersionCode (the highest, 63) and can track future tags. The three
# per-ABI Builds blocks above are what actually build.
AutoUpdateMode: Version
UpdateCheckMode: Tags
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
  - '%c * 10 + 3'
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.2.1
CurrentVersionCode: 63
