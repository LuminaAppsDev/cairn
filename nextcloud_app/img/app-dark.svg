<!--
  SPDX-FileCopyrightText: 2026 Max Fiedler
  SPDX-License-Identifier: AGPL-3.0-or-later

  A cairn: four stones stacked and tapering upward.

  Black on purpose. The "-dark" suffix means a dark icon for a LIGHT background,
  not an icon for dark mode — Nextcloud picks this variant on light surfaces
  such as the apps list in settings, and img/app.svg (white) for the coloured
  header bar. 25 of the bundled apps ship the pair the same way.

  Keep this identical to img/app.svg apart from the fill.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="#000">
	<rect x="1.4" y="11.5" width="13.2" height="2.8" rx="1.4"/>
	<rect x="2.9" y="7.9" width="10.2" height="2.8" rx="1.4"/>
	<rect x="4.4" y="4.3" width="7.2" height="2.8" rx="1.4"/>
	<rect x="5.9" y="0.9" width="4.2" height="2.6" rx="1.3"/>
</svg>
