;
; Development overrides, layered on top of the image's own php.ini.
;
; The Nextcloud image ships opcache.revalidate_freq=60, which is right for a
; server and wrong for a working tree mounted live: an edited PHP file keeps
; serving its previous version for up to a minute, so a change appears not to
; have worked and then mysteriously does. Revalidating on every request costs a
; stat() per file and makes "save the file, reload the page" actually true.
opcache.revalidate_freq = 0

; Report everything while developing; the server defaults to hiding notices.
error_reporting = E_ALL
