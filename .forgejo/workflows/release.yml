# Builds and publishes the signed sideload APKs when a vX.Y.Z tag is pushed.
#
# Runs on the self-hosted, BARE-METAL Forgejo runner (label: linux) — not a
# container. Consequences: the host must already provide git, curl, jq, base64
# and sha256sum; the workspace persists between runs (actions/checkout cleans it
# with git clean -ffdx); and the keystore + key.properties are wiped in an
# always() cleanup because the disk is not discarded with the job.
#
# REPRODUCIBLE BUILDS — why every step runs from $BUILD_DIR, not the workspace.
# Dart's AOT compiler embeds the absolute Flutter project root into libapp.so
# (flutter/flutter#165111): a release APK literally contains the string
# "file://<project root>/.dart_tool/flutter_build/dart_plugin_registrant.dart".
# F-Droid rebuilds this app and compares the result byte-for-byte against the
# APKs published here, so both sides must compile at the SAME absolute path or
# verification can never succeed. We pin it to $BUILD_DIR on this side and the
# fdroiddata recipe moves its checkout onto the same path — see
# fdroid/com.luminaapps.cairn.yml and docs/RELEASE.md §2a.
#
# $BUILD_DIR is deliberately NOT under /tmp: the staged copy holds the decoded
# keystore and key.properties, and /tmp on a shared host is both world-traversable
# and a symlink-race target. /build is created 0700 and owned by the runner user.
#
# The release publishes FOUR APKs, all idempotent (re-run safe) and attached to
# the tagged commit:
#   * cairn-<tag>.apk           - universal, for humans who just want a download
#   * cairn-<tag>-<abi>.apk x3  - one per ABI, what F-Droid verifies against.
#     Named by ABI rather than versionCode so a human can tell which one they
#     need; the recipe addresses them with a per-block `binary:` because a single
#     app-level `Binaries:` template only substitutes %v and %c, never the ABI.
# to TWO places:
#   * GitHub (the public, user-facing repo, GH_REPO) — releases are NOT mirrored
#     from Forgejo, so they are created via the GitHub API with GH_RELEASE_TOKEN.
#   * the Forgejo repo this runs on (git.fiedler.live) — via the Forgejo API
#     with RELEASE_TOKEN, using the run's own GITHUB_SERVER_URL / REPOSITORY.
#
# `uses:` are FULL URLs pinned to commit SHAs: a self-hosted Forgejo would
# otherwise resolve a bare `actions/checkout` against itself, and the SHA pin
# stops a moving tag from injecting code into a job holding the keystore/tokens.
# The trailing `# vN` is the human-readable version.
#
# Required Actions secrets:
#   GH_RELEASE_TOKEN   - GitHub token (contents: write on GH_REPO)
#   RELEASE_TOKEN      - Forgejo token (write access to this repo)
#   KEYSTORE_BASE64    - base64 of the release keystore (.jks)
#   KEYSTORE_PASSWORD  - keystore storePassword
#   KEY_ALIAS          - key alias
#   KEY_PASSWORD       - key password
#
# This job NEVER calls sudo. /build is provisioned once, out of band, as root;
# the job only verifies it and fails closed if it is wrong. A passwordless sudo
# grant reachable from here would be reachable by every dependency the build
# resolves, which is a far larger exposure than the signing key it would guard.
# One-time host prep — see docs/RELEASE.md 2a-repro:
#   sudo mkdir -p /build && sudo chown "$(id -u -n <runner-user>):" /build
#   sudo chmod 700 /build
name: Release APK

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

# $BUILD_DIR is a fixed path (reproducibility requires it), so two overlapping
# runs would share one staging tree — and one job's always() cleanup would delete
# the other's keystore mid-build. Serialise instead of cancelling: cancelling
# mid-upload would leave a release half-populated.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # GitHub owner/repo that receives the public release.
  GH_REPO: LuminaAppsDev/cairn
  # Flutter SDK version — the single source of truth; the F-Droid recipe greps
  # this literal out of the file. Keep it a plain quoted number on one line:
  # the recipe's sed fails the build if this line's shape changes.
  FLUTTER_VERSION: '3.44.0'
  # The exact upstream commit FLUTTER_VERSION must resolve to. Tags are mutable;
  # this build decodes the keystore before invoking the toolchain, so a silently
  # moved tag would run unreviewed code with the signing key readable on disk.
  # Verified after clone; bump both lines together.
  FLUTTER_COMMIT: '559ffa3f75e7402d65a8def9c28389a9b2e6fe42'
  # Absolute path every Flutter/Gradle step compiles from. MUST stay identical
  # to the path the fdroiddata recipe moves its checkout onto, or F-Droid's
  # reproducible-build verification fails. See the header comment.
  BUILD_DIR: /build/cairn

jobs:
  release:
    runs-on: linux
    steps:
      - name: Validate release tag
        # The tag is interpolated into JSON, URLs and shell in the build and
        # publish steps below, so validate it once here — before any step
        # consumes it — rather than relying on a downstream step's internal
        # check surviving a future reorder. Anchored: digits/dots with an
        # optional -suffix only (rejects '#', '+', '@', whitespace, …);
        # GITHUB_REF_NAME is fixed for the whole job.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "Unexpected tag: $tag" >&2
            exit 1
          fi

      - name: Checkout
        uses: https://github.com/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Stage source at the pinned build path
        # Everything from `pub get` onward runs here, not in the workspace,
        # because .dart_tool/ and the AOT snapshot both bake in absolute paths.
        # /build is NOT created here: provisioning it would need sudo, and this
        # job must not hold a privilege every resolved dependency could reach.
        # It is verified instead, and the job fails closed with the prep command.
        run: |
          set -euo pipefail
          parent="$(dirname "$BUILD_DIR")"
          if [ ! -d "$parent" ]; then
            echo "Missing $parent — one-time host prep required, as root:" >&2
            echo "  sudo mkdir -p $parent" >&2
            echo "  sudo chown \"\$(id -u -n):\" $parent && sudo chmod 700 $parent" >&2
            echo "See docs/RELEASE.md 2a-repro." >&2
            exit 1
          fi
          # A symlinked parent would redirect the keystore write below into an
          # attacker-chosen directory; mkdir -p accepts a symlink-to-dir silently.
          if [ -L "$parent" ] || [ -L "$BUILD_DIR" ]; then
            echo "Refusing to build: $parent or $BUILD_DIR is a symlink" >&2
            exit 1
          fi
          if [ "$(stat -c '%u' "$parent")" != "$(id -u)" ]; then
            echo "$parent must be owned by uid $(id -u), found $(stat -c '%u' "$parent")" >&2
            exit 1
          fi
          if [ "$(stat -c '%a' "$parent")" != "700" ]; then
            echo "$parent must be mode 700, found $(stat -c '%a' "$parent")" >&2
            exit 1
          fi
          avail=$(df -Pk "$parent" | awk 'NR==2 {print $4}')
          if [ "$avail" -lt 8388608 ]; then
            echo "Need >=8 GiB free at $parent, have $((avail / 1048576)) GiB" >&2
            exit 1
          fi
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cp -a "$GITHUB_WORKSPACE"/. "$BUILD_DIR"/

      - name: Set up Java
        uses: https://github.com/actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        # Install Flutter from github.com directly rather than via
        # subosito/flutter-action: that is a COMPOSITE action that internally
        # `uses: actions/cache`, and a bare `actions/*` ref resolves against this
        # self-hosted Forgejo instance (no such repo) and fails. A plain clone
        # avoids all nested-action resolution. Cached per version on the
        # bare-metal host; the version comes from FLUTTER_VERSION (env above),
        # which is also the single source the F-Droid recipe greps.
        run: |
          set -euo pipefail
          flutter_home="$HOME/flutter-$FLUTTER_VERSION"
          if [ ! -x "$flutter_home/bin/flutter" ]; then
            # Stage the clone and move it into place, rather than cloning
            # straight to $flutter_home. A run killed mid-clone would otherwise
            # leave that path half-populated, and `git clone` refuses to write
            # into a non-empty directory — wedging every later run of BOTH
            # workflows until someone deleted it by hand. ci.yml's
            # cancel-in-progress makes exactly that reachable.
            staging="$(mktemp -d "$HOME/.flutter-staging.XXXXXXXX")"
            trap 'rm -rf "$staging"' EXIT
            git clone --depth 1 -b "$FLUTTER_VERSION" \
              https://github.com/flutter/flutter.git "$staging/flutter"
            # Atomic within one filesystem. If another job published first,
            # mv fails; keep theirs rather than clobbering a tree in use.
            mv -T "$staging/flutter" "$flutter_home" 2>/dev/null || true
          fi
          if [ ! -x "$flutter_home/bin/flutter" ]; then
            echo "No usable Flutter SDK at $flutter_home after install." >&2
            exit 1
          fi
          git config --global --add safe.directory "$flutter_home"
          # Fail closed if the tag has moved since FLUTTER_COMMIT was recorded.
          actual=$(git -C "$flutter_home" rev-parse HEAD)
          if [ "$actual" != "$FLUTTER_COMMIT" ]; then
            echo "Flutter $FLUTTER_VERSION resolved to $actual, expected $FLUTTER_COMMIT" >&2
            echo "The upstream tag moved, or the cached SDK is stale. Re-check before releasing." >&2
            exit 1
          fi
          echo "$flutter_home/bin" >> "$GITHUB_PATH"

      - name: Dependencies
        # PUB_CACHE is pinned inside $BUILD_DIR so the resolved package paths
        # match the F-Droid recipe (which does the same) and so this job stops
        # mutating the runner's shared ~/.pub-cache.
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          flutter pub get --enforce-lockfile

      - name: Analyze and test
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          dart analyze
          flutter test

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          keystore="$BUILD_DIR/android/app/release-keystore.jks"
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore")
          (umask 077 && {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties)

      - name: Build release APKs
        # Splits first, then the universal APK. Both land in the same output dir
        # under distinct names, so neither clobbers the other. The per-ABI APKs
        # carry the versionCodeOverride from android/app/build.gradle.kts
        # (base * 10 + abiIndex); the universal build has no ABI filter, so it
        # keeps the plain pubspec versionCode.
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          export PUB_CACHE="$BUILD_DIR/.pub-cache"
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Package release assets
        # Collects everything the publish steps upload into dist/, so the naming
        # scheme lives in exactly one place. Per-ABI assets are named by ABI, not
        # by versionCode: the name is what a human reads when picking a download.
        # The recipe reaches them through a per-block `binary:` URL, which is what
        # makes ABI names possible — a single app-level `Binaries:` template can
        # only substitute %v and %c. The versionCodes themselves still come from
        # `abiCodes` in android/app/build.gradle.kts and are declared per block in
        # the recipe; they are simply no longer part of the filename.
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          tag="${GITHUB_REF_NAME}"  # validated in the "Validate release tag" step
          apks="build/app/outputs/flutter-apk"
          if [ -z "${GITHUB_WORKSPACE:-}" ]; then
            echo "GITHUB_WORKSPACE is unset; refusing to build a dist path from it" >&2
            exit 1
          fi
          dist="$GITHUB_WORKSPACE/dist"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp "$apks/app-release.apk" "$dist/cairn-${tag}.apk"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "$apks/app-${abi}-release.apk" "$dist/cairn-${tag}-${abi}.apk"
          done
          cd "$dist"
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd "$GITHUB_WORKSPACE/dist"
          api="https://api.github.com/repos/${GH_REPO}"
          accept="Accept: application/vnd.github+json"
          apiver="X-GitHub-Api-Version: 2022-11-28"
          # The token goes in a 0600 config file rather than an -H argument:
          # a process's argv is readable by any local user through /proc, and
          # this runner is a shared bare-metal host.
          # mktemp creates the file 0600 before the token is written to it.
          # curl's config format is quoted, so a token containing " or \ would
          # be mis-parsed — provider-issued tokens are hex/base64url, so this
          # holds, but it is an assumption worth knowing if that ever changes.
          #
          # Each trap is installed before the next resource is created: under
          # `set -e` a failing second mktemp aborts the step, and a single trap
          # registered after both would never run to remove the first file.
          cfg="$(mktemp)"
          trap 'rm -f "$cfg"' EXIT
          body="$(mktemp)"
          trap 'rm -f "$cfg" "$body"' EXIT
          # Print an API error body without turning the job log into a leak.
          # Some proxies and debug-mode servers echo the request's own headers
          # back in the response, so an Authorization header can surface here;
          # and an HTML error page would otherwise flood the log.
          dump_body() {
            head -c 2000 "$body" | sed -E \
              -e 's#([Bb]earer|[Tt]oken)[[:space:]]+[A-Za-z0-9._~+/=-]{8,}#\1 [REDACTED]#g' \
              -e 's#("?[Aa]uthorization"?[[:space:]]*[:=][[:space:]]*"?)[^",}]*#\1[REDACTED]#g'
            echo
          }
          printf 'header = "Authorization: Bearer %s"\n' "$GH_TOKEN" > "$cfg"
          curlopts=(--config "$cfg" --connect-timeout 30 --max-time 900)
          # The lookup has to tell "no such release" apart from "the API is
          # unwell": neither body carries an `.id`, so deciding from jq alone
          # would read a transient 5xx as "no release exists" and take the
          # create branch. Branch on the status instead. -sS (not -fsS) so the
          # status is readable rather than curl aborting the step; --retry rides
          # out a brief blip and is safe here only because the lookup is a GET.
          # Anything that is neither 200 nor 404 fails the job.
          http=$(curl -sS "${curlopts[@]}" --retry 3 --retry-delay 2 \
            -o "$body" -w '%{http_code}' \
            "$api/releases/tags/$tag" -H "$accept" -H "$apiver") || {
            echo "release lookup for $tag failed: curl transport error" >&2
            exit 1
          }
          case "$http" in
            200)
              release_id=$(jq -r '.id // empty' < "$body" 2>/dev/null || true)
              if [ -z "$release_id" ]; then
                echo "release lookup for $tag: HTTP 200, but no release id" >&2
                dump_body >&2
                exit 1
              fi
              ;;
            404)
              payload=$(jq -n --arg t "$tag" --arg sha "$GITHUB_SHA" \
                '{tag_name:$t, target_commitish:$sha, name:$t, body:"Automated release. See CHANGELOG.md."}')
              release_id=$(curl -fsS "${curlopts[@]}" -X POST "$api/releases" \
                -H "$accept" -H "$apiver" -d "$payload" | jq -r '.id')
              ;;
            *)
              echo "release lookup for $tag failed: HTTP $http" >&2
              dump_body >&2
              exit 1
              ;;
          esac
          [ -n "$release_id" ] && [ "$release_id" != "null" ]
          # Re-run safe: drop any existing same-named assets before re-uploading
          # (recovers a partially-failed run; lets a re-tag replace the binaries).
          assets=$(curl -fsS "${curlopts[@]}" --retry 3 --retry-delay 2 \
            "$api/releases/${release_id}/assets" -H "$accept" -H "$apiver")
          # A `while read` loop, not a single capture: a run that raced before the
          # `concurrency:` guard existed can leave duplicate same-named assets,
          # and collapsing several ids into one URL would hard-fail the step
          # instead of cleaning them up.
          for f in *; do
            printf '%s' "$assets" \
              | jq -r --arg a "$f" '.[] | select(.name == $a) | .id' \
              | while read -r aid; do
                  curl -fsS "${curlopts[@]}" -X DELETE "$api/releases/assets/$aid" -H "$accept" -H "$apiver"
                done
          done
          up="https://uploads.github.com/repos/${GH_REPO}/releases/${release_id}/assets"
          for f in *; do
            case "$f" in
              *.apk) ct='application/vnd.android.package-archive' ;;
              *)     ct='text/plain' ;;
            esac
            curl -fsS "${curlopts[@]}" -X POST "$up?name=$f" \
              -H "Content-Type: $ct" --data-binary "@$f"
          done

      - name: Publish Forgejo release
        env:
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd "$GITHUB_WORKSPACE/dist"
          # The run's own server + repo (git.fiedler.live / tux/cairn); the tag
          # already exists here (it triggered this run).
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          # Each trap is installed before the next resource is created: under
          # `set -e` a failing second mktemp aborts the step, and a single trap
          # registered after both would never run to remove the first file.
          cfg="$(mktemp)"
          trap 'rm -f "$cfg"' EXIT
          body="$(mktemp)"
          trap 'rm -f "$cfg" "$body"' EXIT
          # Print an API error body without turning the job log into a leak.
          # Some proxies and debug-mode servers echo the request's own headers
          # back in the response, so an Authorization header can surface here;
          # and an HTML error page would otherwise flood the log.
          dump_body() {
            head -c 2000 "$body" | sed -E \
              -e 's#([Bb]earer|[Tt]oken)[[:space:]]+[A-Za-z0-9._~+/=-]{8,}#\1 [REDACTED]#g' \
              -e 's#("?[Aa]uthorization"?[[:space:]]*[:=][[:space:]]*"?)[^",}]*#\1[REDACTED]#g'
            echo
          }
          printf 'header = "Authorization: token %s"\n' "$FORGEJO_TOKEN" > "$cfg"
          curlopts=(--config "$cfg" --connect-timeout 30 --max-time 900)
          # See the GitHub step: branch on the HTTP status, not on whether jq
          # found an id, so a transient 5xx cannot pass for "no release yet".
          http=$(curl -sS "${curlopts[@]}" --retry 3 --retry-delay 2 \
            -o "$body" -w '%{http_code}' "$api/releases/tags/$tag") || {
            echo "release lookup for $tag failed: curl transport error" >&2
            exit 1
          }
          case "$http" in
            200)
              release_id=$(jq -r '.id // empty' < "$body" 2>/dev/null || true)
              if [ -z "$release_id" ]; then
                echo "release lookup for $tag: HTTP 200, but no release id" >&2
                dump_body >&2
                exit 1
              fi
              ;;
            404)
              payload=$(jq -n --arg t "$tag" \
                '{tag_name:$t, name:$t, body:"Automated release. See CHANGELOG.md."}')
              release_id=$(curl -fsS "${curlopts[@]}" -X POST "$api/releases" \
                -H 'Content-Type: application/json' -d "$payload" | jq -r '.id')
              ;;
            *)
              echo "release lookup for $tag failed: HTTP $http" >&2
              dump_body >&2
              exit 1
              ;;
          esac
          [ -n "$release_id" ] && [ "$release_id" != "null" ]
          up="$api/releases/${release_id}/assets"
          # Re-run safe: drop any existing same-named assets before re-uploading.
          assets=$(curl -fsS "${curlopts[@]}" --retry 3 --retry-delay 2 "$up")
          # See the GitHub step: a loop, so duplicate same-named assets are all
          # removed rather than collapsing into one malformed request.
          for f in *; do
            printf '%s' "$assets" \
              | jq -r --arg a "$f" '.[] | select(.name == $a) | .id' \
              | while read -r aid; do
                  curl -fsS "${curlopts[@]}" -X DELETE "$up/$aid"
                done
          done
          for f in *; do
            case "$f" in
              *.apk) ct='application/vnd.android.package-archive' ;;
              *)     ct='text/plain' ;;
            esac
            curl -fsS "${curlopts[@]}" -X POST "$up?name=$f" \
              -F "attachment=@$f;type=$ct"
          done

      - name: Clean up signing material
        if: always()
        # The staged tree holds the decoded keystore and key.properties, and this
        # host's disk is not discarded with the job — so the whole staging dir
        # goes, not just the two files. Guarded so an unset BUILD_DIR can never
        # turn this into `rm -rf /`.
        # No `set -e`: one failing removal must not skip the others. But the
        # step's exit status is then whatever the LAST command returned, which
        # would report success even if the keystore removal failed and left
        # plaintext signing material on this shared host. Accumulate instead and
        # exit non-zero so a failure is visible.
        run: |
          set -uo pipefail
          status=0
          if [ -n "${BUILD_DIR:-}" ] && [ "$BUILD_DIR" != "/" ]; then
            # Named-file removal first so the secrets are gone even if the
            # recursive delete below fails partway (busy file, permissions).
            # These are the paths "Configure signing" actually writes to —
            # relative paths here would resolve against the workspace and be
            # a silent no-op.
            rm -f "$BUILD_DIR/android/key.properties" \
                  "$BUILD_DIR/android/app/release-keystore.jks" || status=1
            rm -rf "$BUILD_DIR" || status=1
          fi
          if [ -n "${GITHUB_WORKSPACE:-}" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" || status=1
          fi
          if [ "$status" -ne 0 ]; then
            echo "Cleanup failed to remove signing material — inspect $BUILD_DIR" >&2
          fi
          exit "$status"
